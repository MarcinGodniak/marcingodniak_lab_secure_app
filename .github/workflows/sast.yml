name: Perform Mixeway Scan
jobs:
  mixeway-scan:
    name: Mixeway Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Prepare variables
        id: vars
        shell: bash
        run: |
          echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
          echo "::set-output name=sha_short::$(git rev-parse HEAD)"
      - name: Prepare Mixeway docker image
        run: |
          docker pull mixeway/scanner:latest
      - name: Run Scan
        run: |
          docker run -e OSS_USERNAME=marcingodniak@gmail.com \
            -e OSS_KEY=sonatype_pat_2FWuJPm4GD5PGFTcNLcZAS9bMiis0TrUJ0Ps-RQsCwbeneRr \
            -e MIXEWAY_URL=https://hub.mixeway.io \
            -e MIXEWAY_KEY=0759f84d-2ebf-4f3d-8040-13fb907df5c3 \
            -e MIXEWAY_PROJECT_ID=214 \
            -e MODE=STANDALONE \
            -e MIXEWAY_PROJECT_NAME=marcingodniak_lab_secure_app \
            -e COMMIT_ID=test \
            -e BRANCH=main \
            -v /opt/lab_sec_audit/sast:/opt/sources \
            mixeway/scanner:latest
